<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Demonstration</title>
</head>
<body style="background-color: lightblue;">

    <h2>Preformatted Text Example</h2>
    <pre>
This is preformatted text.
    It keeps spaces
        and line breaks exactly
as written.
    </pre>

    <h2>Using Blank Spaces</h2>
    <p>
        This sentence has extra spaces:
        Hello&nbsp;&nbsp;&nbsp;&nbsp;World!
    </p>

    <h2>Styled Div Example</h2>
    <div style="background-color: white; color: black; padding: 15px; border: 2px solid black;">
        <p>
            This is a styled div element. It has padding, a border, and a different background color.
        </p>
    </div>

</body>
</html>
